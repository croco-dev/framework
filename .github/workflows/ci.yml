name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Changeset required check
        id: changeset_required
        if: github.event_name == 'pull_request'
        run: pnpm changeset-required:check -- --base origin/${{ github.base_ref }} --head HEAD

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit advisory
        id: security_audit_advisory
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::pnpm audit:prod reported production vulnerabilities. Dependency audit is advisory-only in CI; see security-report artifact."
          fi
          exit "$exit_code"

      - name: Secret scan warning report
        id: security_gitleaks_warning
        shell: bash
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.23.0 detect --source /repo --redact --no-banner --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::gitleaks detected potential secrets (warning-only for PR). Review the SARIF/text report."
            else
              echo "::error::gitleaks detected potential secrets on protected branch. Please review and resolve before merge."
            fi
          fi
          exit "$exit_code"

      - name: Assemble security policy summary
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          {
            echo "# Security policy summary"
            echo ""
            echo "- \`pnpm audit:prod\` dependency audit: advisory-only on pull requests, trunk pushes, and manual runs"
            echo "- \`gitleaks\` secret scanning: warning-only on pull requests; blocking on trunk pushes and manual runs"
            echo "- Release path: release-triggering changes still pass through CI before merge; publish-specific gates live in the Release workflow"
            echo ""
            echo "## Current run"
            echo ""
            echo "- Audit advisory exit code: ${{ steps.security_audit_advisory.outputs.exit_code || 'unknown' }}"
            echo "- Audit advisory duration (seconds): ${{ steps.security_audit_advisory.outputs.duration_seconds || 'unknown' }}"
            echo "- Gitleaks exit code: ${{ steps.security_gitleaks_warning.outputs.exit_code || 'unknown' }}"
            echo "- Gitleaks duration (seconds): ${{ steps.security_gitleaks_warning.outputs.duration_seconds || 'unknown' }}"
            echo ""
            echo "## False positive management"
            echo ""
            echo "1. Review the SARIF/text finding and confirm the secret or dependency path is non-production or test-only data."
            echo "2. For confirmed false positives, add the fingerprint to \`.gitleaksignore\` or an explicit allowlist rule in a dedicated Gitleaks config file."
            echo "3. Keep the ignore entry scoped to the exact fingerprint or path, and document the reason in the pull request before any future enforce rollout."
            echo ""
            echo "## Runtime impact"
            echo ""
            echo "- \`pnpm audit:prod\` advisory report reuses the existing dependency install and should add only the command runtime."
            echo "- \`ghcr.io/gitleaks/gitleaks\` adds one cold-start image pull plus repository scan time; use the recorded duration above as the baseline for enforce decisions."
          } > ci-reports/security/summary.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ci-reports/security
          if-no-files-found: warn

      - name: Architecture circular dependency check
        run: pnpm architecture:check:circular:allowlist

      - name: First-Success Contract Verify
        run: pnpm first-success:verify

      - name: Quick-start Lambda smoke
        run: pnpm quick-start-lambda:smoke

      - name: Lint & Format Check
        id: lint_format_check
        run: |
          pnpm check
          echo "✓ Lint gate: 0 errors verified"

      - name: Build
        id: build
        run: pnpm turbo run build --summarize --continue=always

      - name: Package entrypoint smoke
        run: pnpm package-entrypoints:smoke

      - name: Package binary smoke
        run: pnpm package-bins:smoke

      - name: create-croco-app generated app smoke
        run: pnpm create-croco-app:smoke

      - name: TypeScript check
        id: typecheck
        run: pnpm turbo run typecheck --summarize --continue=always

      - name: Test
        id: test
        run: pnpm turbo run test --summarize --continue=always

      - name: Production-ready package gate
        id: production_ready_package_gate
        if: always()
        shell: bash
        run: |
          production_ready_args=()
          if [ "${{ steps.build.outcome }}" != "skipped" ] && [ "${{ steps.typecheck.outcome }}" != "skipped" ] && [ "${{ steps.test.outcome }}" != "skipped" ]; then
            production_ready_args+=(--require-task-summaries)
          fi
          set +e
          pnpm production-ready:check -- "${production_ready_args[@]}"
          status=$?
          set -e
          if [ -f ci-reports/package-quality/production-ready.md ]; then
            cat ci-reports/package-quality/production-ready.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production-ready package report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish package quality dashboard
        if: always()
        env:
          PACKAGE_QUALITY_CHANGESET_STATUS: ${{ steps.changeset_required.outcome || 'skipped' }}
          PACKAGE_QUALITY_CHECK_STATUS: ${{ steps.lint_format_check.outcome || 'skipped' }}
          PACKAGE_QUALITY_BUILD_STATUS: ${{ steps.build.outcome || 'skipped' }}
          PACKAGE_QUALITY_TYPECHECK_STATUS: ${{ steps.typecheck.outcome || 'skipped' }}
          PACKAGE_QUALITY_TEST_STATUS: ${{ steps.test.outcome || 'skipped' }}
        shell: bash
        run: |
          pnpm package-quality:report
          if [ -f ci-reports/package-quality/report.md ]; then
            cat ci-reports/package-quality/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Package quality dashboard was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload package quality dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-quality-dashboard
          path: ci-reports/package-quality
          if-no-files-found: warn

      - name: CLI integration tests
        run: pnpm --filter @croco/cli test:e2e

      - name: Core package coverage gate
        run: pnpm test:coverage:core

      - name: Core package coverage warning report
        if: always()
        run: pnpm test:coverage:core:warning
        continue-on-error: true

      - name: Publish core coverage baseline summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-reports/coverage/core-warning/report.md ]; then
            cat ci-reports/coverage/core-warning/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Core coverage baseline report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload core coverage warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-warning-report
          path: ci-reports/coverage/core-warning/report.md
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      api-source: ${{ steps.filter.outputs.api-source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'packages/docs/**'
            api-source:
              - 'packages/admin-generated/src/**'
              - 'packages/admin-ops/src/**'
              - 'packages/analytics-core/src/**'
              - 'packages/audit-core/src/**'
              - 'packages/auth-better-auth/src/**'
              - 'packages/auth-clerk/src/**'
              - 'packages/auth-core/src/**'
              - 'packages/batch-qstash/src/**'
              - 'packages/billing-core/src/**'
              - 'packages/create-croco-app/src/**'
              - 'packages/dataloader-core/src/**'
              - 'packages/diagnostics-core/src/**'
              - 'packages/events-core/src/**'
              - 'packages/events-inmemory/src/**'
              - 'packages/features-core/src/**'
              - 'packages/framework-context/src/**'
              - 'packages/framework-preset/src/**'
              - 'packages/framework-routes/src/**'
              - 'packages/frontend-cloudflare/src/**'
              - 'packages/frontend-react/src/**'
              - 'packages/frontend-vite/src/**'
              - 'packages/idempotency-core/src/**'
              - 'packages/integrations-posthog/src/**'
              - 'packages/invitation-core/src/**'
              - 'packages/llm-core/src/**'
              - 'packages/llm-metering/src/**'
              - 'packages/llm-openai/src/**'
              - 'packages/membership-core/src/**'
              - 'packages/metering-core/src/**'
              - 'packages/metering-upstash/src/**'
              - 'packages/metrics-core/src/**'
              - 'packages/migration-runner/src/**'
              - 'packages/notifications-core/src/**'
              - 'packages/openapi-spec/src/**'
              - 'packages/preset-cloudflare/src/**'
              - 'packages/preset-lambda/src/**'
              - 'packages/preset-node/src/**'
              - 'packages/problems-core/src/**'
              - 'packages/protocols-core/src/**'
              - 'packages/protocols-graphql/src/**'
              - 'packages/protocols-rest/src/**'
              - 'packages/protocols-trpc/src/**'
              - 'packages/ratelimit-core/src/**'
              - 'packages/ratelimit-upstash/src/**'
              - 'packages/repository-core/src/**'
              - 'packages/retry-core/src/**'
              - 'packages/rpc-codegen/src/**'
              - 'packages/search-core/src/**'
              - 'packages/storage-core/src/**'
              - 'packages/tasks-qstash/src/**'
              - 'packages/telemetry-api/src/**'
              - 'packages/telemetry-sdk-node/src/**'
              - 'packages/testing/src/**'
              - 'packages/transports-cloudflare-workers/src/**'
              - 'packages/transports-graphql/src/**'
              - 'packages/transports-http/src/**'
              - 'packages/triggers-qstash/src/**'
              - 'packages/tx-core/src/**'
              - 'packages/tx-drizzle/src/**'
              - 'packages/webhooks-core/src/**'
              - 'packages/docs/astro.config.mjs'
              - 'packages/docs/tsconfig.typedoc.json'

  docs-sync-check:
    needs: [validate, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.api-source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs and check for drift
        run: |
          pnpm turbo run docs:build --force
          if ! git diff --exit-code -- packages/docs/src/content/docs/api/; then
            echo "::error::API docs are out of sync. Run 'pnpm docs:build' locally and commit the changes."
            exit 1
          fi

  docs-build:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

  docs-links:
    needs: [changes, docs-build]
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir 'packages/docs/dist'
            --exclude '^https://github\.com/croco-dev/framework(#readme)?$'
            --exclude '^https://github\.com/croco-dev/framework/(blob|tree)/[0-9a-f]{40}/'
            --exclude '^https://github\.com/your-org/croco(#readme)?$'
            'packages/docs/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Changeset required check
        id: changeset_required
        if: github.event_name == 'pull_request'
        run: pnpm changeset-required:check -- --base origin/${{ github.base_ref }} --head HEAD

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit report
        id: security_audit_advisory
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::pnpm audit:prod reported production vulnerabilities. CI keeps the raw audit advisory-only and uploads security-report; release publish gates run pnpm security:audit-policy as the blocker."
          fi
          exit "$exit_code"

      - name: Dependency audit policy report
        id: security_audit_policy
        shell: bash
        run: |
          mkdir -p ci-reports/security
          set +e
          pnpm security:audit-policy
          status=$?
          set -e
          if [ -f ci-reports/security/dependency-audit-policy.md ]; then
            cat ci-reports/security/dependency-audit-policy.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dependency audit policy report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Secret scan warning report
        id: security_gitleaks_warning
        if: always()
        shell: bash
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.23.0 detect --source /repo --redact --no-banner --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::gitleaks detected potential secrets (warning-only for PR). Review the SARIF/text report."
            else
              echo "::error::gitleaks detected potential secrets on protected branch. Please review and resolve before merge."
            fi
          fi
          exit "$exit_code"

      - name: Assemble security policy summary
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          {
            echo "# Security policy summary"
            echo ""
            echo "- \`pnpm audit:prod\` dependency audit: advisory-only in CI on pull requests, trunk pushes, and manual runs"
            echo "- \`pnpm security:audit-policy\` dependency audit policy: blocks unreviewed runtime, generated-app, and release-evidence high-risk findings"
            echo "- \`pnpm security:audit-policy\` release enforcement: blocking in the Release workflow before publish"
            echo "- \`gitleaks\` secret scanning: warning-only on pull requests; blocking on trunk pushes and manual runs"
            echo "- Security allowlist metadata: blocking; audit and secret-scan exceptions require owner, reason, and reviewBy/expiresOn"
            echo "- Release path: release-triggering changes still pass through CI before merge; publish-specific gates live in the Release workflow"
            echo ""
            echo "## Current run"
            echo ""
            echo "- Audit advisory exit code: ${{ steps.security_audit_advisory.outputs.exit_code || 'unknown' }}"
            echo "- Audit advisory duration (seconds): ${{ steps.security_audit_advisory.outputs.duration_seconds || 'unknown' }}"
            echo "- Audit policy result: ${{ steps.security_audit_policy.outcome || 'unknown' }}"
            echo "- Gitleaks exit code: ${{ steps.security_gitleaks_warning.outputs.exit_code || 'unknown' }}"
            echo "- Gitleaks duration (seconds): ${{ steps.security_gitleaks_warning.outputs.duration_seconds || 'unknown' }}"
            echo ""
            echo "## False positive management"
            echo ""
            echo "1. Review the SARIF/text finding and confirm the secret or dependency path is non-production or test-only data."
            echo "2. For confirmed false positives, add the fingerprint to \`.gitleaksignore\` or an explicit allowlist rule in \`.gitleaks.toml\`."
            echo "3. Add matching metadata in \`scripts/security-allowlist-metadata.json\` with owner, reason, and reviewBy/expiresOn."
            echo "4. Keep the ignore entry scoped to the exact fingerprint or path, and document the reason in the pull request before any future enforce rollout."
            echo ""
            echo "## Runtime impact"
            echo ""
            echo "- \`pnpm audit:prod\` advisory report reuses the existing dependency install and should add only the command runtime."
            echo "- \`pnpm security:audit-policy\` reuses the full lockfile audit output and local manifests without installing extra tooling."
            echo "- \`ghcr.io/gitleaks/gitleaks\` adds one cold-start image pull plus repository scan time; use the recorded duration above as the baseline for enforce decisions."
          } > ci-reports/security/summary.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ci-reports/security
          if-no-files-found: warn

      - name: Security allowlist metadata check
        run: pnpm security-allowlists:check

      - name: Architecture circular dependency check
        run: pnpm architecture:check:circular:allowlist

      - name: First-Success Contract Verify
        run: pnpm first-success:verify

      - name: Quick-start Lambda smoke
        run: pnpm quick-start-lambda:smoke

      - name: Lint & Format Check
        id: lint_format_check
        run: |
          pnpm check
          echo "✓ Lint gate: 0 errors verified"

      - name: Build
        id: build
        run: pnpm turbo run build --summarize --continue=always

      - name: Package entrypoint smoke
        run: pnpm package-entrypoints:smoke

      - name: Package binary smoke
        run: pnpm package-bins:smoke

      - name: create-croco-app spine-blocking generated app smoke
        id: generated_app_smoke_spine
        run: pnpm create-croco-app:smoke -- --tier spine-blocking

      - name: create-croco-app ecosystem-advisory generated app smoke
        id: generated_app_smoke_advisory
        continue-on-error: true
        run: pnpm create-croco-app:smoke -- --tier ecosystem-advisory

      - name: Publish generated app smoke summary
        if: always()
        shell: bash
        run: |
          for report in spine-blocking-matrix.md ecosystem-advisory-matrix.md; do
            if [ -f "ci-reports/generated-apps/${report}" ]; then
              cat "ci-reports/generated-apps/${report}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Generated app smoke ${report} was not generated." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload spine-blocking generated app smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-smoke-spine-blocking
          path: |
            ci-reports/generated-apps/spine-blocking-matrix.md
            ci-reports/generated-apps/spine-blocking-matrix.json
          if-no-files-found: warn

      - name: Upload ecosystem-advisory generated app smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-smoke-ecosystem-advisory
          path: |
            ci-reports/generated-apps/ecosystem-advisory-matrix.md
            ci-reports/generated-apps/ecosystem-advisory-matrix.json
          if-no-files-found: warn

      - name: Upload generated app smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-smoke-failure-artifacts
          path: ci-reports/generated-apps/cases
          include-hidden-files: true
          if-no-files-found: ignore

      - name: TypeScript check
        id: typecheck
        run: pnpm turbo run typecheck --summarize --continue=always

      - name: Test
        id: test
        run: pnpm turbo run test --summarize --continue=always

      - name: Provider certification gate
        id: provider_certification_gate
        if: always()
        shell: bash
        run: |
          set +e
          pnpm provider-certification:check
          status=$?
          set -e
          if [ -f ci-reports/package-quality/provider-certification.md ]; then
            cat ci-reports/package-quality/provider-certification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Provider certification matrix report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Production-ready package gate
        id: production_ready_package_gate
        if: always()
        shell: bash
        run: |
          production_ready_args=()
          if [ "${{ steps.build.outcome }}" != "skipped" ] && [ "${{ steps.typecheck.outcome }}" != "skipped" ] && [ "${{ steps.test.outcome }}" != "skipped" ]; then
            production_ready_args+=(--require-task-summaries)
          fi
          set +e
          pnpm production-ready:check -- "${production_ready_args[@]}"
          status=$?
          set -e
          if [ -f ci-reports/package-quality/production-ready.md ]; then
            cat ci-reports/package-quality/production-ready.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production-ready package report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Beta spine promotion gate
        id: spine_promotion_gate
        if: always()
        shell: bash
        run: |
          set +e
          pnpm spine-promotion:check
          status=$?
          set -e
          if [ -f ci-reports/package-quality/spine-promotion.md ]; then
            cat ci-reports/package-quality/spine-promotion.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Beta spine promotion report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish package quality dashboard
        if: always()
        env:
          PACKAGE_QUALITY_CHANGESET_STATUS: ${{ steps.changeset_required.outcome || 'skipped' }}
          PACKAGE_QUALITY_CHECK_STATUS: ${{ steps.lint_format_check.outcome || 'skipped' }}
          PACKAGE_QUALITY_BUILD_STATUS: ${{ steps.build.outcome || 'skipped' }}
          PACKAGE_QUALITY_TYPECHECK_STATUS: ${{ steps.typecheck.outcome || 'skipped' }}
          PACKAGE_QUALITY_TEST_STATUS: ${{ steps.test.outcome || 'skipped' }}
          PACKAGE_QUALITY_PROVIDER_CERTIFICATION_STATUS: ${{ steps.provider_certification_gate.outcome || 'skipped' }}
          PACKAGE_QUALITY_PRODUCTION_READY_STATUS: ${{ steps.production_ready_package_gate.outcome || 'skipped' }}
          PACKAGE_QUALITY_SPINE_PROMOTION_STATUS: ${{ steps.spine_promotion_gate.outcome || 'skipped' }}
        shell: bash
        run: |
          pnpm package-quality:report
          if [ -f ci-reports/package-quality/report.md ]; then
            cat ci-reports/package-quality/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Package quality dashboard was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload package quality dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-quality-dashboard
          path: ci-reports/package-quality
          if-no-files-found: warn

      - name: CLI integration tests
        run: pnpm --filter @croco/cli test:e2e

      - name: Core package coverage gate
        run: pnpm test:coverage:core

      - name: Core package coverage warning report
        if: always()
        run: pnpm test:coverage:core:warning

      - name: Publish core coverage warning summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-reports/coverage/core-warning/report.md ]; then
            cat ci-reports/coverage/core-warning/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Core coverage warning report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload core coverage warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-warning-report
          path: ci-reports/coverage/core-warning/report.md
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      api-source: ${{ steps.filter.outputs.api-source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**/*.md'
              - 'packages/*/README.md'
              - 'packages/docs/**'
            api-source:
              - 'packages/access-core/src/**'
              - 'packages/access-drizzle/src/**'
              - 'packages/admin-core/src/**'
              - 'packages/admin-generated/src/**'
              - 'packages/admin-ops/src/**'
              - 'packages/admin-react/src/**'
              - 'packages/analytics-core/src/**'
              - 'packages/analytics-posthog/src/**'
              - 'packages/architecture-policy/src/**'
              - 'packages/audit-core/src/**'
              - 'packages/audit-drizzle/src/**'
              - 'packages/auth-better-auth/src/**'
              - 'packages/auth-clerk/src/**'
              - 'packages/auth-core/src/**'
              - 'packages/auth-drizzle/src/**'
              - 'packages/batch-core/src/**'
              - 'packages/batch-qstash/src/**'
              - 'packages/billing-core/src/**'
              - 'packages/billing-polar/src/**'
              - 'packages/cache-core/src/**'
              - 'packages/cli/src/**'
              - 'packages/create-croco-app/src/**'
              - 'packages/customer-health-core/src/**'
              - 'packages/customer-health-drizzle/src/**'
              - 'packages/dataloader-core/src/**'
              - 'packages/diagnostics-core/src/**'
              - 'packages/entitlements-core/src/**'
              - 'packages/entitlements-drizzle/src/**'
              - 'packages/esbuild-plugin/src/**'
              - 'packages/events-core/src/**'
              - 'packages/events-inmemory/src/**'
              - 'packages/events-tx/src/**'
              - 'packages/execution-core/src/**'
              - 'packages/execution-drizzle/src/**'
              - 'packages/features-core/src/**'
              - 'packages/features-posthog/src/**'
              - 'packages/framework-config/src/**'
              - 'packages/framework-context/src/**'
              - 'packages/framework-logger/src/**'
              - 'packages/framework-module/src/**'
              - 'packages/framework-preset/src/**'
              - 'packages/framework-routes/src/**'
              - 'packages/frontend-cloudflare/src/**'
              - 'packages/frontend-problems/src/**'
              - 'packages/frontend-react/src/**'
              - 'packages/frontend-vite/src/**'
              - 'packages/gid-core/src/**'
              - 'packages/governance-core/src/**'
              - 'packages/health-core/src/**'
              - 'packages/idempotency-core/src/**'
              - 'packages/impersonation-core/src/**'
              - 'packages/integrations-posthog/src/**'
              - 'packages/invitation-core/src/**'
              - 'packages/invitation-drizzle/src/**'
              - 'packages/lifecycle-core/src/**'
              - 'packages/llm-core/src/**'
              - 'packages/llm-metering/src/**'
              - 'packages/llm-openai/src/**'
              - 'packages/membership-core/src/**'
              - 'packages/membership-drizzle/src/**'
              - 'packages/meta-vite/src/**'
              - 'packages/metering-core/src/**'
              - 'packages/metering-drizzle/src/**'
              - 'packages/metering-upstash/src/**'
              - 'packages/metrics-billing/src/**'
              - 'packages/metrics-core/src/**'
              - 'packages/migration-runner/src/**'
              - 'packages/notifications-core/src/**'
              - 'packages/notifications-resend/src/**'
              - 'packages/onboarding-core/src/**'
              - 'packages/onboarding-drizzle/src/**'
              - 'packages/openapi-spec/src/**'
              - 'packages/outbox-core/src/**'
              - 'packages/pagination-core/src/**'
              - 'packages/presentation-preset/src/**'
              - 'packages/preset-cloudflare/src/**'
              - 'packages/preset-lambda/src/**'
              - 'packages/preset-node/src/**'
              - 'packages/problems-core/src/**'
              - 'packages/protocols-core/src/**'
              - 'packages/protocols-graphql/src/**'
              - 'packages/protocols-rest/src/**'
              - 'packages/protocols-trpc/src/**'
              - 'packages/ratelimit-core/src/**'
              - 'packages/ratelimit-upstash/src/**'
              - 'packages/repository-core/src/**'
              - 'packages/retry-core/src/**'
              - 'packages/rpc-codegen/src/**'
              - 'packages/search-core/src/**'
              - 'packages/search-drizzle/src/**'
              - 'packages/search-meilisearch/src/**'

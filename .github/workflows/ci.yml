              - 'packages/transports-graphql/src/**'
              - 'packages/transports-http/src/**'
              - 'packages/triggers-core/src/**'
              - 'packages/triggers-qstash/src/**'
              - 'packages/tx-core/src/**'
              - 'packages/tx-drizzle/src/**'
              - 'packages/ui-astryx/src/**'
              - 'packages/webhooks-core/src/**'
              - 'packages/workflow-core/src/**'
              - 'packages/docs/astro.config.mjs'
              - 'packages/docs/tsconfig.typedoc.json'

  docs-sync-check:
    needs: [validate, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.api-source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs and check for drift
        run: |
          pnpm turbo run docs:build --force
          mapfile -t generated_api_docs < <(git diff --name-only -- packages/docs/src/content/docs/api/)
          if [ "${#generated_api_docs[@]}" -gt 0 ]; then
            pnpm exec oxfmt --write "${generated_api_docs[@]}"
          fi
          if ! git diff --exit-code -- packages/docs/src/content/docs/api/; then
            echo "::error::API docs are out of sync. Run 'pnpm docs:build', format the changed API docs with oxfmt, then commit the changes."
            exit 1
          fi

  docs-build:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

  docs-links:
    needs: [changes, docs-build]
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclusions are intentionally narrow: the repository landing URL is
          # canonical, current-commit blob/tree links are generated docs anchors,
          # your-org/croco is scaffold placeholder text, archived OpenAI API docs
          # return transient 503s from Wayback, diataxis.fr rate-limits automated
          # docs link checks, and packages/docs is a private docs app
          # rather than a public package README.
          args: >-
            --verbose
            --no-progress
            --root-dir '${{ github.workspace }}/packages/docs/dist'
            --exclude '^https://github\.com/croco-dev/framework(#readme)?$'
            --exclude '^https://github\.com/croco-dev/framework/(blob|tree)/[0-9a-f]{40}/'
            --exclude '^https://github\.com/your-org/croco(#readme)?$'
            --exclude '^https://web\.archive\.org/web/[0-9]+/https://developers\.openai\.com/api/'
            --exclude '^https://diataxis\.fr/(how-to-guides|reference)/$'
            --exclude-path '(^|/)packages/docs/README\.md$'
            'README.md'
            'docs/**/*.md'
            'packages/*/README.md'
            'packages/docs/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit warning report
        id: security_audit_warning
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::pnpm audit:prod reported production vulnerabilities. See security-warning-report artifact."
          fi
          exit "$exit_code"

      - name: Secret scan warning report
        id: security_gitleaks_warning
        shell: bash
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.23.0 detect --source /repo --redact --no-banner --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::gitleaks detected potential secrets (warning-only for PR). Review the SARIF/text report."
            else
              echo "::error::gitleaks detected potential secrets on protected branch. Please review and resolve before merge."
            fi
          fi
          exit "$exit_code"

      - name: Assemble security warning summary
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          {
            echo "# Security warning summary"
            echo ""
            echo "- \`pnpm audit:prod\` dependency audit: blocking on trunk push, warning-only on PR"
            echo "- \`gitleaks\` secret scanning: blocking on trunk push, warning-only on PR"
            echo ""
            echo "## Current run"
            echo ""
            echo "- Audit warning exit code: ${{ steps.security_audit_warning.outputs.exit_code || 'unknown' }}"
            echo "- Audit warning duration (seconds): ${{ steps.security_audit_warning.outputs.duration_seconds || 'unknown' }}"
            echo "- Gitleaks warning exit code: ${{ steps.security_gitleaks_warning.outputs.exit_code || 'unknown' }}"
            echo "- Gitleaks warning duration (seconds): ${{ steps.security_gitleaks_warning.outputs.duration_seconds || 'unknown' }}"
            echo ""
            echo "## False positive management"
            echo ""
            echo "1. Review the SARIF/text finding and confirm the secret or dependency path is non-production or test-only data."
            echo "2. For confirmed false positives, add the fingerprint to \`.gitleaksignore\` or an explicit allowlist rule in a dedicated Gitleaks config file."
            echo "3. Keep the ignore entry scoped to the exact fingerprint or path, and document the reason in the pull request before any future enforce rollout."
            echo ""
            echo "## Runtime impact"
            echo ""
            echo "- \`pnpm audit:prod\` warning report reuses the existing dependency install and should add only the command runtime."
            echo "- \`ghcr.io/gitleaks/gitleaks\` adds one cold-start image pull plus repository scan time; use the recorded duration above as the baseline for enforce decisions."
          } > ci-reports/security/summary.md

      - name: Upload security warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-warning-report
          path: ci-reports/security
          if-no-files-found: warn

      - name: Architecture circular dependency check
        run: |
          echo "Checking circular dependencies against allowlist..."
          CIRCULAR_OUTPUT=$(pnpm architecture:check:circular 2>&1) || true
          ALLOWLIST_FILE=".madge-circular-allowlist.txt"
          if [ -f "$ALLOWLIST_FILE" ]; then
            # Extract cycle count from output
            CYCLE_COUNT=$(echo "$CIRCULAR_OUTPUT" | grep -oP '\d+(?= circular)' || echo "0")
            ALLOWLIST_COUNT=$(grep -cve '^\s*#' -e '^\s*$' "$ALLOWLIST_FILE" || echo "0")
            if [ "$CYCLE_COUNT" -gt "$ALLOWLIST_COUNT" ]; then
              echo "::error::New circular dependency detected. Existing: $ALLOWLIST_COUNT, Found: $CYCLE_COUNT. See .madge-circular-allowlist.txt for allowlisted cycles."
              exit 1
            fi
            echo "Circular dependency check passed ($CYCLE_COUNT existing, all allowlisted)"
          else
            # No allowlist yet — fail on any circular dependency
            if echo "$CIRCULAR_OUTPUT" | grep -q 'circular'; then
              echo "::error::Circular dependency found. Create .madge-circular-allowlist.txt to allowlist existing cycles."
              exit 1
            fi
            echo "Circular dependency check passed (no allowlist, no violations)"
          fi

      - name: First-Success Contract Verify
        run: pnpm first-success:verify

      - name: Lint & Format Check
        run: |
          pnpm check
          echo "✓ Lint gate: 0 errors verified"

      - name: Build
        run: pnpm build

      - name: Package entrypoint smoke
        run: pnpm package-entrypoints:smoke

      - name: TypeScript check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Core package coverage gate
        run: pnpm test:coverage:core

      - name: Core package coverage warning report
        if: always()
        run: pnpm test:coverage:core:warning
        continue-on-error: true

      - name: Upload core coverage warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-warning-report
          path: coverage/core-warning/report.md
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      api-source: ${{ steps.filter.outputs.api-source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'packages/docs/**'
            api-source:
              - 'packages/framework-context/src/**'
              - 'packages/retry-core/src/**'
              - 'packages/problems-core/src/**'
              - 'packages/events-core/src/**'
              - 'packages/events-inmemory/src/**'
              - 'packages/auth-core/src/**'
              - 'packages/ratelimit-core/src/**'
              - 'packages/metering-core/src/**'
              - 'packages/transports-http/src/**'
              - 'packages/telemetry-api/src/**'
              - 'packages/telemetry-sdk-node/src/**'
              - 'packages/llm-core/src/**'
              - 'packages/docs/astro.config.mjs'
              - 'packages/docs/tsconfig.typedoc.json'

  docs-sync-check:
    needs: [validate, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.api-source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs and check for drift
        run: |
          pnpm turbo run docs:build --force
          if ! git diff --exit-code -- packages/docs/src/content/docs/api/; then
            echo "::error::API docs are out of sync. Run 'pnpm docs:build' locally and commit the changes."
            exit 1
          fi

  docs-build:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

  docs-links:
    needs: [changes, docs-build]
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.api-source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir 'packages/docs/dist'
            --exclude '^https://github\.com/croco-dev/framework(#readme)?$'
            --exclude '^https://github\.com/croco-dev/framework/(blob|tree)/[0-9a-f]{40}/'
            --exclude '^https://github\.com/your-org/croco(#readme)?$'
            'packages/docs/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

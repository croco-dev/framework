name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: TypeScript check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      api-source: ${{ steps.filter.outputs.api-source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'packages/docs/**'
            api-source:
              - 'packages/framework-context/src/**'
              - 'packages/retry-core/src/**'
              - 'packages/problems-core/src/**'
              - 'packages/events-core/src/**'
              - 'packages/events-inmemory/src/**'
              - 'packages/auth-core/src/**'
              - 'packages/ratelimit-core/src/**'
              - 'packages/metering-core/src/**'
              - 'packages/transports-http/src/**'
              - 'packages/telemetry-api/src/**'
              - 'packages/telemetry-sdk-node/src/**'
              - 'packages/llm-core/src/**'
              - 'packages/docs/astro.config.mjs'
              - 'packages/docs/tsconfig.typedoc.json'

  docs-build:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

  docs-links:
    needs: [changes, docs-build]
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'packages/docs/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

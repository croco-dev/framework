name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      membership-postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: croco_membership
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d croco_membership"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.23.0@sha256:b4b81841085b4060054a71155500a340e3d2e2a5995c186546649e3efd80b84e
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification profile
        id: verification
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$EVENT_BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
          fi
          node --experimental-strip-types scripts/verification-change-classifier.mts \
            --event "$GITHUB_EVENT_NAME" --workflow ci --base "$base" --head HEAD --github-output "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Initialize beta spine promotion evidence
        env:
          SPINE_PROMOTION_COMMIT_SHA: ${{ github.sha }}
          SPINE_PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          SPINE_PROMOTION_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci-reports/package-quality
          node -e 'const fs = require("node:fs"); fs.writeFileSync("ci-reports/package-quality/spine-promotion-run.json", JSON.stringify({ commitSha: process.env.SPINE_PROMOTION_COMMIT_SHA, runId: process.env.SPINE_PROMOTION_RUN_ID, runAttempt: process.env.SPINE_PROMOTION_RUN_ATTEMPT, startedAt: new Date().toISOString() }, null, 2) + "\n")'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify membership owner concurrency against PostgreSQL
        env:
          MEMBERSHIP_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
        run: pnpm --filter @croco/membership-drizzle exec vitest run src/tests/DrizzleMembershipStore.postgres.spec.ts

      - name: Production dependency audit report
        id: security_audit_advisory
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::pnpm audit:prod reported production vulnerabilities. CI keeps the raw audit advisory-only and uploads security-report; release publish gates run pnpm security:audit-policy as the blocker."
          fi
          exit "$exit_code"

      - name: Security Gitleaks acceptance smoke
        run: pnpm security:gitleaks-smoke

      - name: Secret scan blocking report
        id: security_gitleaks
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          : > ci-reports/security/gitleaks.txt
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > ci-reports/security/gitleaks.sarif
          start=$(date +%s)
          set +e
          docker run --rm -v "$PWD:/repo" "${{ env.GITLEAKS_IMAGE }}" detect --source /repo --redact --no-banner --log-opts=HEAD --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::Gitleaks secret scanning failed. Review the redacted SARIF/text report; remove findings from reachable history or use a reviewed exact fingerprint or bounded path. Scanner operational failures are also blocking."
          fi
          node --experimental-strip-types scripts/security-gitleaks-smoke.mts --ensure-sarif ci-reports/security/gitleaks.sarif || exit_code=$?
          exit "$exit_code"

      - name: Assemble security policy summary
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          if [ "${{ steps.verification.outputs.profile }}" = "publish" ]; then
            audit_policy_result="selected by the shared publish profile"
          else
            audit_policy_result="not selected by the ${{ steps.verification.outputs.profile }} profile"
          fi
          {
            echo "# Security policy summary"
            echo ""
            echo "- \`pnpm audit:prod\` dependency audit: advisory-only in CI on pull requests, trunk pushes, and manual runs"
            echo "- \`pnpm security:audit-policy\` dependency audit policy: blocks unreviewed runtime, generated-app, and release-evidence high-risk findings"
            echo "- \`pnpm security:audit-policy\` release enforcement: blocking in the Release workflow before publish"
            echo "- \`gitleaks\` secret scanning: blocking on pull requests, trunk pushes, and manual runs"
            echo "- Security allowlist metadata: blocking; audit and secret-scan exceptions require owner, reason, and reviewBy/expiresOn"
            echo "- Release path: release-triggering changes still pass through CI before merge; publish-specific gates live in the Release workflow"
            echo ""
            echo "## Current run"
            echo ""
            echo "- Audit advisory exit code: ${{ steps.security_audit_advisory.outputs.exit_code || 'unknown' }}"
            echo "- Audit advisory duration (seconds): ${{ steps.security_audit_advisory.outputs.duration_seconds || 'unknown' }}"
            echo "- Audit policy result: $audit_policy_result"
            echo "- Gitleaks exit code: ${{ steps.security_gitleaks.outputs.exit_code || 'unknown' }}"
            echo "- Gitleaks duration (seconds): ${{ steps.security_gitleaks.outputs.duration_seconds || 'unknown' }}"
            echo ""
            echo "## False positive management"
            echo ""
            echo "1. Review the SARIF/text finding and confirm the secret or dependency path is non-production or test-only data."
            echo "2. For confirmed false positives, add an exact fingerprint to \`.gitleaksignore\` or a fully anchored bounded path to \`.gitleaks.toml\`."
            echo "3. Add matching metadata in \`scripts/security-allowlist-metadata.json\` with owner, reason, and reviewBy/expiresOn."
            echo "4. Keep the entry scoped to the exact fingerprint or bounded path and document the reason in the pull request."
            echo ""
            echo "## Runtime impact"
            echo ""
            echo "- \`pnpm audit:prod\` advisory report reuses the existing dependency install and should add only the command runtime."
            echo "- \`pnpm security:audit-policy\` reuses the full lockfile audit output and local manifests without installing extra tooling."
            echo "- \`ghcr.io/gitleaks/gitleaks\` adds one cold-start image pull plus repository scan time; use the recorded duration above as the baseline for enforce decisions."
          } > ci-reports/security/summary.md
          cat ci-reports/security/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: ci-reports/security
          if-no-files-found: warn

      - name: Run selected verification profile
        id: verification_profile
        shell: bash
        run: |
          args=(--profile "${{ steps.verification.outputs.profile }}")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--allow-pending-release-metadata --base "${{ steps.verification.outputs.base }}" --head HEAD)
          fi
          node --experimental-strip-types scripts/release-spine-evidence.mts "${args[@]}"

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          report="ci-reports/verification/${{ steps.verification.outputs.profile }}/spine-evidence.md"
          if [ "${{ steps.verification.outputs.profile }}" = "spine" ]; then
            report="ci-reports/release/spine-evidence.md"
          fi
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verification report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ steps.verification.outputs.profile }}
          path: |
            ci-reports/verification
            ci-reports/release
          include-hidden-files: true
          if-no-files-found: warn

      - name: create-croco-app ecosystem-advisory generated app smoke
        if: steps.verification.outputs.profile != 'repo'
        id: generated_app_smoke_advisory
        continue-on-error: true
        run: pnpm create-croco-app:smoke -- --tier ecosystem-advisory

      - name: Publish generated app smoke summary
        if: always()
        shell: bash
        run: |
          for report in spine-blocking-matrix.md ecosystem-advisory-matrix.md spine-blocking-journeys/report.md; do
            if [ -f "ci-reports/generated-apps/${report}" ]; then
              cat "ci-reports/generated-apps/${report}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Generated app smoke ${report} was not generated." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload spine-blocking generated app smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-spine-blocking
          path: |
            ci-reports/generated-apps/spine-blocking-matrix.md
            ci-reports/generated-apps/spine-blocking-matrix.json
            ci-reports/generated-apps/spine-blocking-journeys
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload ecosystem-advisory generated app smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-ecosystem-advisory
          path: |
            ci-reports/generated-apps/ecosystem-advisory-matrix.md
            ci-reports/generated-apps/ecosystem-advisory-matrix.json
          if-no-files-found: warn

      - name: Upload generated app smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-failure-artifacts
          path: ci-reports/generated-apps/cases
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload package quality dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-quality-dashboard
          path: ci-reports/package-quality
          if-no-files-found: warn

      - name: Publish core coverage warning summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-reports/coverage/core-warning/report.md ]; then
            cat ci-reports/coverage/core-warning/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Core coverage warning report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload core coverage warning report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage-warning-report
          path: ci-reports/coverage/core-warning/report.md
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      api-source: ${{ steps.filter.outputs.api-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**/*.md'

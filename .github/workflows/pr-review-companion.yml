name: PR Review Companion

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-review-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contract diff CLI
        run: pnpm --filter @croco/cli... build

      - name: Generate companion report
        run: |
          base_ref="${GITHUB_BASE_REF:-trunk}"
          git fetch origin "$base_ref"
          pnpm pr-review-companion -- --base "origin/${base_ref}" --head HEAD --run-required-checks --github-annotations

      - name: Publish companion summary
        if: always()
        run: |
          if [ -f ci-reports/pr-review-companion/report.md ]; then
            cat ci-reports/pr-review-companion/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR Review Companion report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload companion report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-companion-report
          path: ci-reports/pr-review-companion
          if-no-files-found: warn

name: Release

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release work
        id: release_work
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          changed_files="$(git diff --name-only "$base" HEAD)"
          if echo "$changed_files" | grep -Eq '^\.changeset/[^/]+\.md$|^packages/[^/]+/(package\.json|CHANGELOG\.md)$|^package\.json$|^pnpm-lock\.yaml$'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No changeset, manifest, changelog, or lockfile changes detected; skipping release pipeline."
          fi

      - name: Setup pnpm
        if: steps.release_work.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.release_work.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # Release duplicates the publish-blocking CI quality gates that protect
      # npm publishing. PR-only checks, secret-scan reports, and docs/coverage
      # report artifact jobs stay in CI before release-triggering changes land.
      # audit:prod intentionally ignores GHSA-gv7w-rqvm-qjhr: it covers the
      # esbuild Deno API install path, while Croco release builds use Node/pnpm.
      - name: Production dependency audit
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm audit:prod

      - name: Lint, format, and repository policy checks
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm check

      - name: Build all packages
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm build

      - name: Package entrypoint smoke
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm package-entrypoints:smoke

      - name: TypeScript check
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm test

      - name: Dry-run publish gate
        if: steps.release_work.outputs.should_run == 'true'
        run: pnpm -r publish --dry-run --no-git-checks

      - name: Create Release Pull Request or Publish
        if: steps.release_work.outputs.should_run == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          LEFTHOOK: "0"

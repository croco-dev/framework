name: Release

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_ref_guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified_sha: ${{ steps.verify_ref.outputs.verified_sha }}
    steps:
      - name: Verify protected release ref
        id: verify_ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/trunk" ]; then
            rejected_ref="${GITHUB_REF:-<unset>}"
            echo "::error title=Unsupported Release ref::Release only supports refs/heads/trunk; received $rejected_ref. Re-run the workflow from the trunk branch."
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Release SHA::Release requires the immutable 40-character SHA selected from refs/heads/trunk. Re-run the workflow from the trunk branch."
            exit 1
          fi
          echo "verified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: release_ref_guard
    if: github.ref == 'refs/heads/trunk' && needs.release_ref_guard.outputs.verified_sha == github.sha
    runs-on: ubuntu-latest
    # The publish profile has a 150-minute internal budget; the job leaves
    # 90 minutes for setup, artifact publication, and Changesets.
    timeout-minutes: 240
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release_ref_guard.outputs.verified_sha }}

      - name: Select release work and verification profile
        id: release_work
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          args=(--event "$GITHUB_EVENT_NAME" --workflow release --github-output "$GITHUB_OUTPUT")
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            base="$EVENT_BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
            fi
            args+=(--base "$base" --head HEAD)
          fi
          node --experimental-strip-types scripts/verification-change-classifier.mts "${args[@]}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Verify release PR automation credentials
        if: github.ref == 'refs/heads/trunk' && needs.release_ref_guard.outputs.verified_sha == github.sha && steps.release_work.outputs.should_run_changesets_action == 'true'
        shell: bash
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=()
          if [ -z "$RELEASE_APP_CLIENT_ID" ]; then
            missing+=(RELEASE_APP_CLIENT_ID)
          fi
          if [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            missing+=(RELEASE_APP_PRIVATE_KEY)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release App credentials missing::Configure ${missing[*]} per RELEASING.md before rerunning Release."
            exit 1
          fi

      - name: Setup pnpm
        if: steps.release_work.outputs.should_run_verification == 'true' || steps.release_work.outputs.should_run_changesets_action == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        if: steps.release_work.outputs.should_run_verification == 'true' || steps.release_work.outputs.should_run_changesets_action == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.release_work.outputs.should_run_verification == 'true' || steps.release_work.outputs.should_run_changesets_action == 'true'
        run: pnpm install --frozen-lockfile

      # Release reruns the complete publish profile as defense in depth. Tokens,
      # provenance permissions, summaries, uploads, and Changesets remain Actions-owned.
      - name: Release publish verification
        id: release_spine_evidence
        if: steps.release_work.outputs.should_run_verification == 'true'
        shell: bash
        run: |
          args=(--output-dir ci-reports/release)
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            args+=(--base "${{ steps.release_work.outputs.base }}" --head HEAD)
          fi
          pnpm verify:publish -- "${args[@]}"

      - name: Publish release spine evidence summary
        if: always() && steps.release_work.outputs.should_run_verification == 'true'
        shell: bash
        run: |
          if [ -f ci-reports/release/spine-evidence.md ]; then
            cat ci-reports/release/spine-evidence.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release spine evidence report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release spine evidence
        if: always() && steps.release_work.outputs.should_run_verification == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-spine-evidence
          path: ci-reports/release
          include-hidden-files: true
          if-no-files-found: warn

      - name: Mint release PR GitHub App token
        id: release_app_token
        if: github.ref == 'refs/heads/trunk' && needs.release_ref_guard.outputs.verified_sha == github.sha && steps.release_work.outputs.should_run_changesets_action == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Publish
        if: github.ref == 'refs/heads/trunk' && needs.release_ref_guard.outputs.verified_sha == github.sha && steps.release_work.outputs.should_run_changesets_action == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm exec changeset publish
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LEFTHOOK: "0"

name: Performance Benchmark

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - name: Run benchmarks with threshold check
        run: pnpm bench:check
        env:
          CI: true

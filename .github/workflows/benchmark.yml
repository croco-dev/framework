name: Performance Benchmark

on:
  pull_request:
    branches: [trunk]
    paths:
      - "packages/*/src/**"
      - "benchmarks/**"
      - "ci-reports/benchmark/**"
      - "scripts/bench-threshold-check.mts"
      - "scripts/benchmark-readiness-report.mts"
      - "scripts/post-benchmark-comment.mjs"
      - "scripts/tests/**"
      - "package.json"
      - "vitest.config.ts"
      - "vitest.config.bench.ts"
      - "tsconfig.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCHMARK_GATE_MODE: enforce

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run benchmarks with threshold check
        id: bench
        run: pnpm tracked-files:guard --recovery 'pnpm bench:update' -- pnpm bench:check --output-json=benchmark-result.json
        continue-on-error: true
        env:
          CI: true
      - name: Publish benchmark enforce-readiness report
        id: readiness
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BENCHMARK_STEP_OUTCOME: ${{ steps.bench.outcome }}
          BENCHMARK_STEP_CONCLUSION: ${{ steps.bench.conclusion }}
        run: |
          set +e
          pnpm bench:readiness --input=benchmark-result.json --output=ci-reports/benchmark/summary.md --variance-evidence=ci-reports/benchmark/latest-five-green-runs.md
          readiness_exit=$?
          cat ci-reports/benchmark/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$readiness_exit"
      - name: Upload benchmark readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-readiness-report
          path: |
            benchmark-result.json
            ci-reports/benchmark/summary.md
            ci-reports/benchmark/latest-five-green-runs.md
          if-no-files-found: warn
      - name: Comment PR with benchmark results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const { run } = await import('${{ github.workspace }}/scripts/post-benchmark-comment.mjs');
            await run({ github, context });
      - name: Fail if benchmark enforcement failed
        if: env.BENCHMARK_GATE_MODE == 'enforce' && (steps.bench.outcome == 'failure' || steps.readiness.outcome == 'failure')
        run: exit 1

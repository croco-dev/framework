name: CI Performance Observer

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-performance-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download untrusted performance data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-performance-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ci-observer-input/performance
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download untrusted verification data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verification-*
          path: ci-observer-input/verification
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read source run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PULL_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p ci-observer-input
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > ci-observer-input/run.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
            > ci-observer-input/jobs.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > ci-observer-input/artifacts.json
          if [ -n "$SOURCE_PULL_NUMBER" ]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/pull/${SOURCE_PULL_NUMBER}/merge" \
              --jq '.object.sha' \
              > ci-observer-input/execution-sha.txt
          else
            jq -r '.head_sha' ci-observer-input/run.json > ci-observer-input/execution-sha.txt
          fi
          execution_sha=$(cat ci-observer-input/execution-sha.txt)
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${execution_sha}" \
            > ci-observer-input/execution-commit.json
          if [ -n "$SOURCE_PULL_NUMBER" ]; then
            jq -er \
              '.pull_requests | select(length == 1) | .[0].base.sha' \
              ci-observer-input/run.json \
              > ci-observer-input/base-sha.txt
            expected_head_sha=$(jq -er '.pull_requests[0].head.sha' ci-observer-input/run.json)
            expected_base_sha=$(cat ci-observer-input/base-sha.txt)
            jq -e \
              --arg expected_base_sha "$expected_base_sha" \
              --arg expected_head_sha "$expected_head_sha" \
              '(.parents | length) == 2 and
               .parents[0].sha == $expected_base_sha and
               .parents[1].sha == $expected_head_sha' \
              ci-observer-input/execution-commit.json >/dev/null
          elif [ "$(jq -er '.event' ci-observer-input/run.json)" = "push" ]; then
            jq -er '.parents | select(length >= 1) | .[0].sha' \
              ci-observer-input/execution-commit.json \
              > ci-observer-input/base-sha.txt
          else
            : > ci-observer-input/base-sha.txt
          fi
          if [ -s ci-observer-input/base-sha.txt ]; then
            git fetch --no-tags --depth=1 origin "$(cat ci-observer-input/base-sha.txt)"
          fi
          git fetch --no-tags --depth=1 origin "$execution_sha"
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/package.json" \
            -f "ref=${execution_sha}" \
            --jq '.content' \
            | base64 --decode \
            > ci-observer-input/source-package.json
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/test-inventory.json" \
            -f "ref=${execution_sha}" \
            --jq '.content' \
            | base64 --decode \
            > ci-observer-input/source-test-inventory.json
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/ci.yml" \
            -f "ref=${execution_sha}" \
            --jq '.content' \
            | base64 --decode \
            > ci-observer-input/source-ci.yml

      - name: Download exact split evidence when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_total=$(jq -r '.total_count' ci-observer-input/artifacts.json)
          artifact_page_count=$(jq -r '.artifacts | length' ci-observer-input/artifacts.json)
          if [ "$artifact_total" -ne "$artifact_page_count" ]; then
            echo "Source artifact response is incomplete." >&2
            exit 1
          fi
          split_artifact_count=$(jq -r '[.artifacts[] | select(.name | startswith("ci-lane-"))] | length' ci-observer-input/artifacts.json)
          if [ "$split_artifact_count" -eq 0 ]; then
            exit 0
          fi
          expected_artifacts=(
            "ci-lane-core-verification-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
            "ci-lane-generated-apps-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
            "ci-lane-package-artifacts-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
            "ci-lane-coverage-security-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
            "ci-lane-split-validation-shadow-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          )
          if [ "$split_artifact_count" -ne "${#expected_artifacts[@]}" ]; then
            echo "Expected an exact five-artifact Phase B split evidence set." >&2
            exit 1
          fi
          mkdir -p ci-observer-input/split
          for artifact_name in "${expected_artifacts[@]}"; do
            matching_count=$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' ci-observer-input/artifacts.json)
            if [ "$matching_count" -ne 1 ]; then
              echo "Expected one unexpired ${artifact_name} artifact." >&2
              exit 1
            fi
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "ci-observer-input/split/${artifact_name}"
          done

      - name: Record immutable observation
        shell: bash
        run: |
          if [ ! -f ci-observer-input/performance/raw-sample.json ]; then
            echo "The source run did not emit normalized performance evidence." >&2
            exit 1
          fi
          source_profile=$(jq -er '.currentSamples | select(length == 1) | .[0].profile' ci-observer-input/performance/raw-sample.json)
          if [ "$source_profile" != "publish" ]; then
            echo "Non-publish CI run is outside the cacheable-lanes observation cohort." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t verification_reports < <(find ci-observer-input/verification -type f -name spine-evidence.json -print)
          mapfile -t fast_lane_reports < <(find ci-observer-input/verification -type f -name fast-test-lane.json -print)
          if [ "${#verification_reports[@]}" -ne 1 ] || [ "${#fast_lane_reports[@]}" -ne 1 ]; then
            echo "Expected exactly one verification report and fast-lane report." >&2
            exit 1
          fi
          observer_args=(
            --run ci-observer-input/run.json \
            --jobs ci-observer-input/jobs.json \
            --artifacts ci-observer-input/artifacts.json \
            --execution-sha "$(cat ci-observer-input/execution-sha.txt)" \
            --sample ci-observer-input/performance/raw-sample.json \
            --verification "${verification_reports[0]}" \
            --fast-lane "${fast_lane_reports[0]}" \
            --inventory ci-observer-input/source-test-inventory.json \
            --package-metadata ci-observer-input/source-package.json \
            --output ci-observation/observation.json \
            --markdown-output ci-observation/summary.md
          )
          if [ -d ci-observer-input/split ]; then
            mapfile -t producer_reports < <(find ci-observer-input/split -type f -name producer-bundle.json -print | sort)
            mapfile -t shadow_reports < <(find ci-observer-input/split -type f -name split-validation-shadow.json -print)
            mapfile -t split_security_summaries < <(find ci-observer-input/split -type f -name split-security-policy-summary.json -print)
            mapfile -t synthesis_inputs < <(find ci-observer-input/split -type f -name synthesis-input.json -print)
            if [ "${#producer_reports[@]}" -ne 4 ] || [ "${#shadow_reports[@]}" -ne 1 ] || [ "${#split_security_summaries[@]}" -ne 1 ] || [ "${#synthesis_inputs[@]}" -ne 1 ]; then
              echo "Expected four producer bundles, one synthesis input, one split validation shadow report, and one split security summary." >&2
              exit 1
            fi
            for report in "${producer_reports[@]}"; do
              observer_args+=(--producer-bundle "$report")
            done
            observer_args+=(--base-sha "$(cat ci-observer-input/base-sha.txt)")
            observer_args+=(--source-workflow ci-observer-input/source-ci.yml)
            observer_args+=(--synthesis-input "${synthesis_inputs[0]}")
            observer_args+=(--split-validation-shadow "${shadow_reports[0]}")
            observer_args+=(--split-security-summary "${split_security_summaries[0]}")
          fi
          node --experimental-strip-types scripts/ci-performance-observer.mts "${observer_args[@]}"
          cat ci-observation/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable observation
        if: ${{ !cancelled() && hashFiles('ci-observation/observation.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-observation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ci-observation
          if-no-files-found: error
          retention-days: 90

name: Benchmark Comment Publisher

on:
  workflow_run:
    workflows:
      - Performance Benchmark
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted comment publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate source run and current pull request
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PULL_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_PULL_NUMBER" ]; then
            echo "::error::Source benchmark run must reference exactly one pull request."
            exit 1
          fi
          mkdir -p benchmark-comment-metadata
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > benchmark-comment-metadata/run.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PULL_NUMBER}" \
            > benchmark-comment-metadata/pull-request.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
            > benchmark-comment-metadata/jobs.json

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_number "$SOURCE_PULL_NUMBER" \
            --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $run_id and
             .run_attempt == $run_attempt and
             .name == "Performance Benchmark" and
             .event == "pull_request" and
             .status == "completed" and
             .repository.full_name == $repository and
             (.pull_requests | length) == 1 and
             .pull_requests[0].number == $pull_number' \
            benchmark-comment-metadata/run.json >/dev/null

          source_conclusion=$(jq -er '.conclusion' benchmark-comment-metadata/run.json)
          if [ "$source_conclusion" != "success" ] && [ "$source_conclusion" != "failure" ]; then
            echo "Source benchmark run concluded ${source_conclusion}; no benchmark artifact comment is required."
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_head_sha=$(jq -er '.pull_requests[0].head.sha' benchmark-comment-metadata/run.json)
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_head_sha "$source_head_sha" \
            --argjson pull_number "$SOURCE_PULL_NUMBER" \
            '.number == $pull_number and
             .state == "open" and
             .base.repo.full_name == $repository and
             .base.ref == "trunk" and
             .head.sha == $source_head_sha' \
            benchmark-comment-metadata/pull-request.json >/dev/null; then
            echo "Source benchmark run no longer targets the current open trunk pull request; skipping comment."
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jobs_total=$(jq -er '.total_count' benchmark-comment-metadata/jobs.json)
          jobs_page_count=$(jq -er '.jobs | length' benchmark-comment-metadata/jobs.json)
          if [ "$jobs_total" -ne "$jobs_page_count" ]; then
            echo "::error::Source jobs response is incomplete."
            exit 1
          fi

          for job_name in classify benchmark benchmark-gate; do
            matching_jobs=$(jq --arg name "$job_name" '[.jobs[] | select(.name == $name)] | length' benchmark-comment-metadata/jobs.json)
            if [ "$matching_jobs" -ne 1 ]; then
              echo "::error::Expected exactly one ${job_name} source job."
              exit 1
            fi
          done

          benchmark_conclusion=$(jq -er '.jobs[] | select(.name == "benchmark") | .conclusion' benchmark-comment-metadata/jobs.json)
          if [ "$benchmark_conclusion" != "success" ] && [ "$benchmark_conclusion" != "failure" ]; then
            echo "Source benchmark job concluded ${benchmark_conclusion}; no benchmark artifact comment is required."
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > benchmark-comment-metadata/artifacts.json

          expected_artifact="benchmark-readiness-report-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          artifact_total=$(jq -er '.total_count' benchmark-comment-metadata/artifacts.json)
          artifact_page_count=$(jq -er '.artifacts | length' benchmark-comment-metadata/artifacts.json)
          if [ "$artifact_total" -ne "$artifact_page_count" ]; then
            echo "::error::Source artifact response is incomplete."
            exit 1
          fi
          matching_artifacts=$(jq \
            --arg name "$expected_artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            benchmark-comment-metadata/artifacts.json)
          if [ "$matching_artifacts" -ne 1 ]; then
            echo "::error::Expected exactly one unexpired ${expected_artifact} artifact."
            exit 1
          fi
          echo "should_comment=true" >> "$GITHUB_OUTPUT"

      - name: Download exact benchmark readiness report
        if: steps.source.outputs.should_comment == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-readiness-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: benchmark-comment-input
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate untrusted benchmark artifact
        if: steps.source.outputs.should_comment == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if find benchmark-comment-input -type l -print -quit | grep -q .; then
            echo "::error::Benchmark artifact must not contain symbolic links."
            exit 1
          fi
          mapfile -t result_files < <(find benchmark-comment-input -type f -name benchmark-result.json -print)
          if [ "${#result_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one benchmark-result.json file."
            exit 1
          fi
          if [ "$(wc -c < "${result_files[0]}")" -gt 8192 ]; then
            echo "::error::benchmark-result.json exceeds the 8 KiB comment input limit."
            exit 1
          fi
          jq -e '
            type == "object" and
            (.allPassed | type) == "boolean" and
            (.reports | type) == "array" and
            (.reports | length) <= 50 and
            all(.reports[];
              type == "object" and
              (.name | type) == "string" and
              (.name | length) <= 120 and
              (.p75 | type) == "number" and
              (.threshold == null or (.threshold | type) == "number") and
              (.baseline == null or (.baseline | type) == "number") and
              ((.thresholdStatus // "") | type) == "string" and
              ((.thresholdStatus // "") | length) <= 20 and
              ((.baselineStatus // "") | type) == "string" and
              ((.baselineStatus // "") | length) <= 20 and
              ((.thresholdSkipReason // "") | type) == "string" and
              ((.thresholdSkipReason // "") | length) <= 240 and
              ((.baselineSkipReason // "") | type) == "string" and
              ((.baselineSkipReason // "") | length) <= 240
            ) and
            ((.gateFailures // []) | type) == "array" and
            ((.gateFailures // []) | length) <= 20 and
            all((.gateFailures // [])[]; type == "string" and length <= 240)
          ' "${result_files[0]}" >/dev/null
          cp -- "${result_files[0]}" benchmark-comment-metadata/validated-result.json

      - name: Comment PR with benchmark results
        if: steps.source.outputs.should_comment == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = await import('${{ github.workspace }}/scripts/post-benchmark-comment.mjs');
            await run({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: context.payload.workflow_run.pull_requests[0].number,
              sha: context.payload.workflow_run.pull_requests[0].head.sha,
              resultPath: 'benchmark-comment-metadata/validated-result.json',
            });

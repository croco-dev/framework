pre-commit:
  parallel: true
  stage_fixed: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm oxlint --fix --fix-type safe {staged_files} && git add {staged_files}
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm oxfmt --write {staged_files} && git add {staged_files}

pre-push:
  commands:
    test:
      run: pnpm exec turbo run test --output-logs=errors-only --ui=stream --log-order=grouped
    typecheck:
      run: pnpm exec turbo run typecheck --output-logs=errors-only --ui=stream --log-order=grouped

post-merge:
  commands:
    install:
      run: pnpm install

pre-commit:
  parallel: true
  stage_fixed: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write {staged_files}

pre-push:
  commands:
    test:
      run: pnpm test
    typecheck:
      run: pnpm typecheck

post-merge:
  commands:
    install:
      run: pnpm install
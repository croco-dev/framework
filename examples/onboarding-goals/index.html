<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croco activation guide</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: #edf2f3;
        color: #10292d;
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 1.5rem;
        background: white;
        border-radius: 14px;
        box-shadow: 0 10px 32px #10292d18;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.7fr);
        gap: 1.5rem;
      }
      section,
      aside {
        min-width: 0;
      }
      button,
      input,
      select {
        box-sizing: border-box;
        max-width: 100%;
        font: inherit;
        padding: 0.5rem;
      }
      button {
        background: #076d62;
        color: white;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        margin: 0.3rem 0.3rem 0.3rem 0;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      a {
        color: #075e90;
      }
      fieldset {
        border: 1px solid #c4d2d5;
        border-radius: 8px;
        margin: 1rem 0;
      }
      progress {
        width: 100%;
        height: 1.2rem;
      }
      .card {
        border: 1px solid #c4d2d5;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      @media (max-width: 700px) {
        main {
          margin: 0;
          border-radius: 0;
          padding: 1rem;
        }
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/browser.js"></script>
  </body>
</html>

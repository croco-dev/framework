<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User reminders</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        color: #24342c;
        background: #f5f4ef;
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 960px;
        margin: auto;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 23px;
      }
      section {
        background: white;
        border: 1px solid #d7dcd4;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 24px;
      }
      button,
      input,
      select {
        font: inherit;
        padding: 8px;
        margin: 4px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      fieldset {
        border: 1px solid #ccd3ca;
        margin: 12px 0;
        padding: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #ddd;
        overflow-wrap: anywhere;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #42614e;
        outline-offset: 2px;
      }
      [role="alert"] {
        color: #983d24;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      small {
        font-size: 14px;
      }
      @media (max-width: 600px) {
        body {
          padding: 12px;
        }
        section {
          padding: 16px;
        }
        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your weekly reminders</h1>
      <p>Choose when to remember a task. Delivery follows your existing notification preference.</p>
      <div id="root"></div>
    </main>
    <script src="/dist/browser.global.js"></script>
  </body>
</html>

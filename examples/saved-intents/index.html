<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saved reports</title>
    <style>
      body {
        font: 17px system-ui;
        max-width: 960px;
        margin: 40px auto;
        padding: 0 20px;
        background: #faf8f4;
        color: #18342f;
      }
      button,
      input,
      select {
        font: inherit;
        margin: 6px;
        padding: 10px;
        border: 1px solid #607d75;
        border-radius: 6px;
      }
      button {
        cursor: pointer;
        background: white;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      article,
      fieldset {
        padding: 20px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin: 16px 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      button:focus-visible {
        outline: 3px solid #287dba;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/browser.js"></script>
  </body>
</html>

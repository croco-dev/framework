<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Activation candidates</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 32px;
        color: #152638;
        background: #f7f9fc;
      }
      main {
        max-width: 1400px;
        margin: auto;
      }
      section {
        background: white;
        padding: 24px;
        border: 1px solid #ced6df;
        border-radius: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        white-space: nowrap;
      }
      caption {
        text-align: left;
        margin: 16px 0;
      }
      button,
      input {
        font: inherit;
        padding: 8px;
        margin: 4px;
      }
      dt {
        font-weight: bold;
      }
      dd {
        margin: 0 0 8px;
        overflow-wrap: anywhere;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Activation candidates</h1>

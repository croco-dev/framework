title = "Croco gitleaks config"

[extend]
useDefault = true

# Allowlist test fixtures: dummy API keys / idempotency keys under packages/*/src/tests/.
# Scoped tightly to *.spec.ts and one source-digest review record; production code remains scanned.
[allowlist]
description = "Test fixture dummy keys and the #3295 source-digest review record"
paths = ['''^docs/infrastructure-reviews/3295-codegen-cwd\.json$''', '''(^|/)packages/[^/]+/src/tests/.*\.spec\.ts$''']

title = "Croco gitleaks config"

[extend]
useDefault = true

# Allowlist test fixtures: dummy API keys / idempotency keys under packages/*/src/tests/.
# Scoped tightly to *.spec.ts and three source-digest review records; production code remains scanned.
[allowlist]
description = "Test fixture dummy keys and reviewed source-digest records"
paths = [
  '''^docs/infrastructure-reviews/2842-operation-rest\.json$''',
  '''^docs/infrastructure-reviews/clerk-workers-auth-subset\.json$''',
  '''^docs/infrastructure-reviews/3295-codegen-cwd\.json$''',
  '''(^|/)packages/[^/]+/src/tests/.*\.spec\.ts$''',
]

packages:
  - "apps/**/*"
  - "libs/**/*"

overrides:
  postcss: 8.5.18

allowBuilds:
  "@apollo/protobufjs": true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@apollo/protobufjs"
  - esbuild
  - lefthook
  - protobufjs
  - sharp
  - unrs-resolver

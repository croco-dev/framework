packages:
  - "apps/**/*"
  - "libs/**/*"

allowBuilds:
  "@apollo/protobufjs": true
  "@clerk/shared": true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@apollo/protobufjs"
  - "@clerk/shared"
  - esbuild
  - lefthook
  - protobufjs
  - sharp
  - unrs-resolver
